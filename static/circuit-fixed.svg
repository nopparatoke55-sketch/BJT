<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="cf-title cf-desc">
  <title id="cf-title">Fixed-bias circuit</title>
  <desc id="cf-desc">NPN common-emitter stage. RB feeds the base from VCC, RC is the collector resistor and the emitter is tied directly to ground.</desc>
  <defs>
    <marker id="npn-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#103658"/>
    </marker>
  </defs>
  <style>
    .wire{stroke:#415e71;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lead{stroke:#103658;stroke-width:1.9;fill:none;stroke-linecap:round}
    .body{fill:#ffffff;stroke:#103658;stroke-width:2}
    .dot{fill:#415e71}
    .lbl{font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:18px;font-weight:700;fill:#103658}
    .node{font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:14px;font-weight:700;fill:#07766e}
    .note{font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:12px;fill:#6c757d}
    .badge{font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#07766e;letter-spacing:1.2px}
  </style>

  <!-- mode badge -->
  <rect x="14" y="14" width="120" height="24" rx="12" fill="#e8f6f2" stroke="#b4d7cb"/>
  <text class="badge" x="74" y="30" text-anchor="middle">FIXED BIAS</text>

  <!-- supply rail -->
  <line class="wire" x1="90" y1="70" x2="270" y2="70"/>
  <line class="wire" x1="180" y1="70" x2="180" y2="46"/>
  <line x1="169" y1="46" x2="191" y2="46" stroke="#0d6efd" stroke-width="3" stroke-linecap="round"/>
  <text class="lbl" x="180" y="34" text-anchor="middle" fill="#0d6efd">V<tspan font-size="11" dy="2">CC</tspan></text>

  <!-- base branch: RB -->
  <line class="wire" x1="90" y1="70" x2="90" y2="100"/>
  <line class="wire" x1="90" y1="156" x2="90" y2="230"/>
  <line class="wire" x1="90" y1="230" x2="160" y2="230"/>

  <!-- collector branch: RC -->
  <line class="wire" x1="270" y1="70" x2="270" y2="100"/>
  <line class="wire" x1="270" y1="156" x2="270" y2="190"/>
  <line class="wire" x1="212" y1="190" x2="270" y2="190"/>

  <!-- emitter tied directly to ground (no RE) -->
  <line class="wire" x1="212" y1="272" x2="212" y2="400"/>
  <line class="wire" x1="212" y1="400" x2="212" y2="414"/>
  <line x1="194" y1="414" x2="230" y2="414" stroke="#415e71" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="420" x2="224" y2="420" stroke="#415e71" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="205" y1="426" x2="219" y2="426" stroke="#415e71" stroke-width="2" stroke-linecap="round"/>
  <text class="note" x="212" y="442" text-anchor="middle">GND</text>

  <!-- transistor -->
  <circle cx="200" cy="232" r="40" fill="#f3f8fd" stroke="#9db5c6" stroke-width="1.6"/>
  <line class="lead" x1="160" y1="230" x2="178" y2="230"/>
  <line class="lead" x1="178" y1="208" x2="178" y2="256" stroke-width="4"/>
  <line class="lead" x1="178" y1="218" x2="212" y2="190"/>
  <line class="lead" x1="178" y1="246" x2="212" y2="272" marker-end="url(#npn-arrow)"/>

  <!-- resistor bodies (IEC style) -->
  <rect class="body" x="78" y="100" width="24" height="56" rx="3"/>
  <rect class="body" x="258" y="100" width="24" height="56" rx="3"/>

  <!-- VCE annotation -->
  <line x1="310" y1="190" x2="310" y2="272" stroke="#8aa4b6" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="304" y1="190" x2="316" y2="190" stroke="#8aa4b6" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="304" y1="272" x2="316" y2="272" stroke="#8aa4b6" stroke-width="1.4" stroke-linecap="round"/>
  <text class="node" x="322" y="235">V<tspan font-size="10" dy="2">CE</tspan></text>

  <!-- junction dots -->
  <circle class="dot" cx="180" cy="70" r="3.2"/>

  <!-- labels -->
  <text class="lbl" x="68" y="133" text-anchor="end">R<tspan font-size="11" dy="2">B</tspan></text>
  <text class="lbl" x="292" y="133">R<tspan font-size="11" dy="2">C</tspan></text>
  <text class="node" x="108" y="222">V<tspan font-size="10" dy="2">B</tspan></text>
  <text class="node" x="282" y="184">V<tspan font-size="10" dy="2">C</tspan></text>
  <text class="node" x="224" y="284">V<tspan font-size="10" dy="2">E</tspan></text>
  <text class="node" x="246" y="226">Q<tspan font-size="10" dy="2">1</tspan></text>
  <text class="note" x="246" y="242" font-size="11">NPN</text>
  <text class="note" x="226" y="340">RE = 0 (VE = 0 V)</text>
  <text class="note" x="20" y="370">R1 / R2 not used</text>
</svg>
